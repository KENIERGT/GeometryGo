<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GeoCaza · Busca los cuerpos geométricos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1a14">
<style>
  :root{ --bg:#0b1a14; --panel:#10241c; --panel2:#153126; --line:#1f4636; --txt:#e8f5ee;
         --muted:#8fb5a4; --acc:#3ddc97; --acc2:#ffc043; --mal:#ff7a7a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  #escena{position:fixed;inset:0;z-index:1}
  canvas{display:block}
  video,#arjs-video{position:fixed!important;top:0;left:0;width:100%!important;height:100%!important;
    object-fit:cover;z-index:0}

  .pantalla{position:fixed;inset:0;z-index:6;overflow-y:auto;background:var(--bg);
    transform:translateY(0);transition:transform .32s cubic-bezier(.2,.8,.3,1)}
  .pantalla.oculta{transform:translateY(101%);pointer-events:none}
  .pantalla.transparente{background:transparent;pointer-events:none}
  .contenido{max-width:560px;margin:0 auto;padding:14px 14px 30px}

  .tope{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(11,26,20,.96);backdrop-filter:blur(8px);z-index:2}
  .tope h1{margin:0;font-size:15px;font-weight:700}
  .tope h1 span{color:var(--acc)}
  .marcador-puntos{margin-left:auto;text-align:right;font-size:11px;color:var(--muted);line-height:1.3}
  .marcador-puntos b{display:block;font-size:17px;color:var(--acc2);font-variant-numeric:tabular-nums}

  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:999px;
    padding:11px 17px;font-size:14px;cursor:pointer;font-family:inherit}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#04231a;font-weight:700}
  .btn.sec{background:var(--acc2);border-color:var(--acc2);color:#241700;font-weight:700}
  .btn.ancho{width:100%;padding:14px;font-size:16px}
  .btn:disabled{opacity:.45}

  .caja{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 15px;margin-bottom:12px}
  .caja h2{margin:0 0 10px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}

  .progreso{height:9px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:8px 0 4px}
  .progreso i{display:block;height:100%;background:var(--acc);transition:width .4s}

  /* radar */
  #radar{display:none;text-align:center;padding:6px 0 2px}
  #anillos{position:relative;width:150px;height:150px;margin:6px auto 8px}
  #anillos b{position:absolute;inset:0;margin:auto;width:14px;height:14px;border-radius:50%;background:var(--acc)}
  #anillos i{position:absolute;border:2px solid var(--acc);border-radius:50%;opacity:0;
    inset:0;margin:auto;width:14px;height:14px;animation:onda 2.4s infinite}
  #anillos i:nth-child(2){animation-delay:.8s}
  #anillos i:nth-child(3){animation-delay:1.6s}
  @keyframes onda{0%{width:14px;height:14px;opacity:.85}100%{width:150px;height:150px;opacity:0}}
  #radarTxt{font-size:19px;font-weight:700}
  #radarDist{font-size:13px;color:var(--muted);margin-top:2px}

  .lista{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;gap:11px;align-items:center;background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px}
  .item .ico{width:40px;height:40px;border-radius:9px;background:#0d201a;display:grid;place-items:center;
    font-size:21px;flex:0 0 auto}
  .item .txt{flex:1;min-width:0}
  .item .txt b{display:block;font-size:14px}
  .item .txt small{color:var(--muted);font-size:12px;display:block;margin-top:1px}
  .item.hecha{opacity:.72}
  .item.hecha .ico{background:#12332a}
  .insignia{font-size:11px;color:#04231a;background:var(--acc);border-radius:999px;padding:3px 9px;font-weight:700}

  /* cámara */
  #capaCam{position:fixed;inset:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;padding:16px}
  #msjCam{margin-top:14vh;font-size:19px;font-weight:600;text-align:center;padding:12px 20px;
    background:rgba(6,16,12,.72);border-radius:16px;backdrop-filter:blur(6px);max-width:84vw}
  #msjCam small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:5px}
  #accionCam{pointer-events:auto;width:100%;max-width:420px;display:flex;gap:10px}
  #salirCam{position:fixed;top:14px;left:14px;z-index:7;pointer-events:auto}

  /* reto */
  .campo{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px}
  input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:12px;font-size:16px;width:100%;font-family:inherit}
  input.ok{border-color:var(--acc);color:var(--acc)}
  input.mal{border-color:var(--mal)}
  .pista{font-size:12.5px;color:var(--acc2);margin-top:6px;line-height:1.5;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .medidas{font-size:13px;color:var(--acc2);font-variant-numeric:tabular-nums}
  #vista3d{width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#0a1a14;
    border:1px solid var(--line);position:relative}
  .aviso{background:#3a2a12;border:1px solid #6b4d16;color:#ffd98a;border-radius:11px;
    padding:10px 12px;font-size:13px;margin-top:10px}
  .exito{background:#0f3325;border:1px solid #1e6b4a;color:#7ef0b8;border-radius:11px;
    padding:10px 12px;font-size:13.5px;margin-top:10px}
  #qrFin{background:#fff;padding:10px;border-radius:12px;display:none;margin:10px auto 0;width:max-content}
  #qrFin img{display:block;width:180px;height:180px;image-rendering:pixelated}
</style>
</head>
<body>

<div id="escena"></div>

<!-- ============ pantalla principal: mapa / álbum ============ -->
<div class="pantalla" id="pIni">
  <div class="tope">
    <h1>Geo<span>Caza</span></h1>
    <div class="marcador-puntos"><b id="tPuntos">0</b>puntos</div>
  </div>
  <div class="contenido">
    <div class="caja">
      <h2 id="tTitulo">Cacería</h2>
      <div style="display:flex;align-items:baseline;gap:8px">
        <b style="font-size:26px" id="tHechas">0</b>
        <span style="color:var(--muted)">de <span id="tTotal">0</span> figuras encontradas</span>
      </div>
      <div class="progreso"><i id="tBarra" style="width:0%"></i></div>
      <div id="radar">
        <div id="anillos"><i></i><i></i><i></i><b></b></div>
        <div id="radarTxt">Buscando señal…</div>
        <div id="radarDist"></div>
      </div>
      <button class="btn pri ancho" id="btnBuscar" style="margin-top:12px">Buscar con la cámara</button>
    </div>

    <div class="caja">
      <h2>Faltan por encontrar</h2>
      <div class="lista" id="listaPend"></div>
    </div>

    <div class="caja">
      <h2>Mi álbum</h2>
      <div class="lista" id="listaHechas"></div>
      <div id="finCaja"></div>
      <div id="qrFin"></div>
    </div>

    <div class="caja">
      <h2>Jugador</h2>
      <input type="text" id="nombre" maxlength="40" placeholder="Tu nombre y sección">
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn" id="btnGps">Encender GPS</button>
        <button class="btn" id="btnReiniciar">Reiniciar juego</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ pantalla cámara ============ -->
<button class="btn" id="salirCam" style="display:none">‹ Volver</button>
<div id="capaCam" style="display:none">
  <div id="msjCam">Busca el marcador escondido<small>Enfócalo completo, a unos 30–50 cm</small></div>
  <div id="accionCam"></div>
</div>

<!-- ============ pantalla reto ============ -->
<div class="pantalla oculta" id="pReto">
  <div class="tope">
    <button class="btn" id="btnVolverReto">‹ Volver</button>
    <div class="marcador-puntos"><b id="rPuntos">0</b>puntos</div>
  </div>
  <div class="contenido">
    <div class="caja">
      <h2 id="rTitulo">¡Figura capturada!</h2>
      <div id="vista3d"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:9px">
        <label style="font-size:12.5px;color:var(--acc2);white-space:nowrap">Desarrollo</label>
        <input type="range" id="rDes" min="0" max="100" value="0" style="flex:1;accent-color:var(--acc2)">
        <output id="rDesTxt" style="font-size:12px;color:var(--muted);width:66px;text-align:right">armado</output>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;gap:10px;flex-wrap:wrap">
        <b style="font-size:19px" id="rNombre">—</b>
        <span class="medidas" id="rMedidas"></span>
      </div>
      <div class="exito" id="rCaptura">Capturada. Ahora resuélvela para sumar los puntos completos.</div>
    </div>

    <div class="caja">
      <h2>Reto</h2>
      <label class="campo" for="rVol">Volumen en cm³</label>
      <input type="number" id="rVol" step="0.01" inputmode="decimal" placeholder="escribe el resultado">
      <div class="pista" id="pVol"></div>

      <label class="campo" for="rAre">Área total en cm²</label>
      <input type="number" id="rAre" step="0.01" inputmode="decimal" placeholder="escribe el resultado">
      <div class="pista" id="pAre"></div>

      <button class="btn pri ancho" id="btnComprobar" style="margin-top:14px">Comprobar</button>
      <div id="rAviso"></div>
    </div>
  </div>
</div>

<script src="vendor/three.global.js"></script>
<script src="vendor/ar-threex.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="js/geometria.js"></script>
<script src="js/marcadores.js"></script>
<script src="js/caceria.js"></script>
<script>
/* =====================================================================
   GeoCaza — juego de búsqueda de cuerpos geométricos
   El docente esconde marcadores impresos. El estudiante los busca con la
   cámara; al encontrarlos captura la figura y resuelve su volumen y su
   área total. El GPS, cuando hay, funciona como radar de frío/caliente.
   ===================================================================== */

const $ = s => document.querySelector(s);
const PUNTOS_CAPTURA = 10, PUNTOS = [20, 12, 6, 0];   // según el intento

/* ---------- 1. cacería y progreso ---------- */
function cargarCaceria(){
  const h = decodeURIComponent(location.hash.replace(/^#/,''));
  const m = h.match(/(?:^|&)j=([^&]*)/);
  const desdeURL = m ? decodificarCaceria(m[1]) : (h ? decodificarCaceria(h) : null);
  if(desdeURL){ guardar('geocaza.cfg', codificarCaceria(desdeURL)); return desdeURL; }
  const g = leer('geocaza.cfg');
  return (g && decodificarCaceria(g)) || CACERIA_DEFECTO;
}
function guardar(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

const CAZA = cargarCaceria();
const CLAVE = 'geocaza.prog.' + hash(codificarCaceria(CAZA));
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h).toString(36); }

let prog = (() => {
  try{ const g = JSON.parse(leer(CLAVE)); if(g && g.figs && g.figs.length === CAZA.figuras.length) return g; }catch(e){}
  return { figs: CAZA.figuras.map(()=>({capturada:false, vol:false, are:false, intV:0, intA:0})),
           puntos:0, nombre:'', inicio:Date.now() };
})();
function guardarProg(){ guardar(CLAVE, JSON.stringify(prog)); }
$('#nombre').value = prog.nombre || '';
$('#nombre').oninput = () => { prog.nombre = $('#nombre').value; guardarProg(); };

/* ---------- 2. escena 3D compartida ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);   // fuera de cualquier contexto de apilamiento
renderer.domElement.style.cssText = 'position:fixed;inset:0;z-index:2;display:none';

const escena = new THREE.Scene();
escena.add(new THREE.HemisphereLight(0xffffff, 0x2c4a3c, 1.2));
const luz = new THREE.DirectionalLight(0xffffff, .9); luz.position.set(3,6,4); escena.add(luz);

const camAR = new THREE.Camera();
const camPC = new THREE.PerspectiveCamera(45, 4/3, .01, 1000);
const raizPC = new THREE.Group(); raizPC.visible = false; escena.add(raizPC);
const contenido = new THREE.Group();
const raices = [];
let grupoCuerpo = null, pivotes = [], tArmado = 1, modo = 'inicio';
/* tArmado = 1 cuerpo armado, 0 red plana */
function aplicarPliegue(){
  for(const p of pivotes) p.rotation.x = -p.userData.pliegue * tArmado;
  contenido.scale.setScalar(1/(1+(1-tArmado)*0.95));
}   // inicio | camara | reto

function construirFigura(f){
  if(grupoCuerpo){ contenido.remove(grupoCuerpo); }
  const def = CUERPOS[f.cuerpo], dims = dimsFigura(f);
  grupoCuerpo = construirRed(def.red(dims));
  pivotes = grupoCuerpo.userData.pivotes;
  const esc = 1.25 / Math.max(...Object.values(dims), 6);
  grupoCuerpo.scale.setScalar(esc);
  contenido.add(grupoCuerpo);
  aplicarPliegue();            // nace desplegada: hay que armarla
  return def;
}

/* ---------- 3. realidad aumentada ---------- */
let arSource = null, arContext = null, arListo = false;
function iniciarAR(cb){
  if(arListo) return cb && cb(true);
  if(!window.isSecureContext){ return cb && cb(false, 'La cámara solo funciona con https:// o en localhost.'); }
  arSource = new THREEx.ArToolkitSource({sourceType:'webcam', sourceWidth:640, sourceHeight:480,
    displayWidth:innerWidth, displayHeight:innerHeight});
  arSource.init(()=> setTimeout(ajustarAR, 300),
                ()=> cb && cb(false, 'No se pudo abrir la cámara. Revisa el permiso del navegador.'));
  arContext = new THREEx.ArToolkitContext({cameraParametersUrl:'data/camera_para.dat',
    detectionMode:'mono', maxDetectionRate:30, canvasWidth:640, canvasHeight:480});
  arContext.init(()=>{
    camAR.projectionMatrix.copy(arContext.getProjectionMatrix());
    CAZA.figuras.forEach((f,i) => {
      const g = new THREE.Group(); g.visible = false; escena.add(g); raices.push(g);
      new THREEx.ArMarkerControls(arContext, g, {type:'pattern', patternUrl: pattURL(i),
        changeMatrixMode:'modelViewMatrix', smooth:true, smoothCount:5, smoothTolerance:.01, smoothThreshold:2});
    });
    arListo = true; cb && cb(true);
  });
}
function ajustarAR(){
  if(!arSource) return;
  arSource.onResizeElement();
  arSource.copyElementSizeTo(renderer.domElement);
  if(arContext && arContext.arController) arSource.copyElementSizeTo(arContext.arController.canvas);
}

/* ---------- 4. pantallas ---------- */
function irInicio(){
  modo = 'inicio';
  $('#pIni').classList.remove('oculta');
  $('#pReto').classList.add('oculta');
  $('#capaCam').style.display = 'none';
  $('#salirCam').style.display = 'none';
  raizPC.visible = false;
  pararCamara();
  renderer.domElement.style.display = 'none';
  renderer.setSize(innerWidth, innerHeight);
  pintarInicio();
}
function irCamara(){
  $('#btnBuscar').disabled = true;
  $('#btnBuscar').textContent = 'Abriendo la cámara…';
  iniciarAR((ok, err) => {
    $('#btnBuscar').disabled = false;
    $('#btnBuscar').textContent = 'Buscar con la cámara';
    if(!ok){ alert(err || 'No se pudo abrir la cámara.'); return; }
    modo = 'camara';
    $('#pIni').classList.add('oculta');
    $('#pReto').classList.add('oculta');
    $('#capaCam').style.display = 'flex';
    $('#salirCam').style.display = 'block';
    $('#msjCam').innerHTML = 'Busca el marcador escondido<small>Enfócalo completo, a unos 30–50 cm</small>';
    $('#accionCam').innerHTML = '';
    renderer.setSize(innerWidth, innerHeight);
    if(arSource && arSource.domElement) arSource.domElement.style.display = '';
    ajustarAR();
  });
}
function pararCamara(){
  if(arSource && arSource.domElement) arSource.domElement.style.display = 'none';
}
$('#btnBuscar').onclick = irCamara;
$('#salirCam').onclick = irInicio;
$('#btnVolverReto').onclick = irInicio;

/* ---------- 5. pantalla principal ---------- */
const ICONOS = { cubo:'⬛', prisma:'📦', piramide:'🔺', cilindro:'🥫', cono:'🍦' };
function pintarInicio(){
  const total = CAZA.figuras.length;
  const hechas = prog.figs.filter(f=>f.capturada).length;
  $('#tTitulo').textContent = CAZA.titulo;
  $('#tHechas').textContent = hechas;
  $('#tTotal').textContent = total;
  $('#tBarra').style.width = (hechas/total*100) + '%';
  $('#tPuntos').textContent = prog.puntos;
  $('#rPuntos').textContent = prog.puntos;

  const pend = $('#listaPend'), alb = $('#listaHechas');
  pend.innerHTML = ''; alb.innerHTML = '';
  CAZA.figuras.forEach((f,i) => {
    const p = prog.figs[i], def = CUERPOS[f.cuerpo];
    const d = document.createElement('div');
    d.className = 'item' + (p.capturada ? ' hecha' : '');
    if(!p.capturada){
      const dist = distanciaA(f);
      d.innerHTML = `<div class="ico">❓</div><div class="txt"><b>Figura ${i+1}</b>
        <small>${f.pista ? esc(f.pista) : 'sin pista'}${dist!=null ? ' · a ' + Math.round(dist) + ' m' : ''}</small></div>`;
      pend.appendChild(d);
    }else{
      const listo = p.vol && p.are;
      d.innerHTML = `<div class="ico">${ICONOS[f.cuerpo]||'🔷'}</div>
        <div class="txt"><b>${esc(def.nombre)}</b><small>${esc(textoMedidas(f))}</small></div>
        ${listo ? '<span class="insignia">resuelta</span>'
                : '<button class="btn" style="padding:7px 12px;font-size:12.5px">Resolver</button>'}`;
      if(!listo) d.querySelector('button').onclick = () => abrirReto(i, false);
      else d.onclick = () => abrirReto(i, false);
      alb.appendChild(d);
    }
  });
  if(!pend.children.length) pend.innerHTML = '<div class="nota" style="color:var(--muted);font-size:13px">¡Ya las encontraste todas!</div>';
  if(!alb.children.length) alb.innerHTML = '<div style="color:var(--muted);font-size:13px">Todavía no has capturado ninguna.</div>';

  pintarFinal(hechas, total);
  actualizarRadar();
}
const esc = s => String(s||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function pintarFinal(hechas, total){
  const resueltas = prog.figs.filter(f=>f.vol && f.are).length;
  const caja = $('#finCaja');
  if(hechas < total){ caja.innerHTML = ''; $('#qrFin').style.display='none'; return; }
  const min = Math.round((Date.now() - prog.inicio)/60000);
  caja.innerHTML = `<div class="exito" style="margin-top:12px">
      <b>¡Cacería completa!</b><br>${resueltas} de ${total} figuras resueltas ·
      ${prog.puntos} puntos · ${min} min</div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn sec" id="btnCodigo">Mostrar código para el docente</button>
      <button class="btn" id="btnCSV">Descargar resultados</button></div>`;
  $('#btnCodigo').onclick = () => {
    const t = `GEOCAZA|${prog.nombre||'sin nombre'}|${CAZA.titulo}|${prog.puntos}|${resueltas}/${total}|${min}min`;
    const q = qrcode(0,'M'); q.addData(t); q.make();
    $('#qrFin').innerHTML = q.createImgTag(4,6) +
      `<div style="color:#000;font-size:11px;text-align:center;margin-top:6px">${esc(prog.nombre||'sin nombre')} · ${prog.puntos} pts</div>`;
    $('#qrFin').style.display = 'block';
  };
  $('#btnCSV').onclick = () => {
    let t = 'figura,cuerpo,medidas,capturada,volumen_ok,area_ok,intentos_volumen,intentos_area\n';
    CAZA.figuras.forEach((f,i) => { const p = prog.figs[i];
      t += `${i+1},${CUERPOS[f.cuerpo].nombre},"${textoMedidas(f)}",${p.capturada?'si':'no'},` +
           `${p.vol?'si':'no'},${p.are?'si':'no'},${p.intV},${p.intA}\n`; });
    t += `\njugador,${prog.nombre||''}\npuntos,${prog.puntos}\nminutos,${min}\n`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([t], {type:'text/csv'}));
    a.download = 'geocaza-resultados.csv'; a.click();
  };
}

$('#btnReiniciar').onclick = () => {
  if(!confirm('¿Borrar tu progreso y empezar de nuevo?')) return;
  prog = { figs: CAZA.figuras.map(()=>({capturada:false, vol:false, are:false, intV:0, intA:0})),
           puntos:0, nombre:prog.nombre, inicio:Date.now() };
  guardarProg(); pintarInicio();
};

/* ---------- 6. radar por GPS ---------- */
let posGps = null, watchId = null;
function distanciaA(f){
  if(!posGps || f.lat == null) return null;
  return distanciaM(posGps.lat, posGps.lon, f.lat, f.lon);
}
$('#btnGps').onclick = () => {
  if(watchId !== null){
    navigator.geolocation.clearWatch(watchId); watchId = null; posGps = null;
    $('#btnGps').textContent = 'Encender GPS'; pintarInicio(); return;
  }
  if(!navigator.geolocation) return alert('Este equipo no tiene GPS.');
  $('#btnGps').textContent = 'Apagar GPS';
  watchId = navigator.geolocation.watchPosition(p => {
    posGps = { lat:p.coords.latitude, lon:p.coords.longitude, prec:p.coords.accuracy||99 };
    if(modo === 'inicio') pintarInicio();
  }, e => { $('#radarTxt').textContent = 'Sin señal de GPS'; },
     { enableHighAccuracy:true, maximumAge:2000, timeout:20000 });
};
function actualizarRadar(){
  const conGps = CAZA.figuras.some((f,i) => f.lat != null && !prog.figs[i].capturada);
  $('#radar').style.display = conGps ? 'block' : 'none';
  if(!conGps) return;
  if(!posGps){ $('#radarTxt').textContent = 'Enciende el GPS';
               $('#radarDist').textContent = 'para usar el radar al aire libre'; return; }
  let mejor = Infinity;
  CAZA.figuras.forEach((f,i) => {
    if(prog.figs[i].capturada) return;
    const d = distanciaA(f);
    if(d != null && d < mejor) mejor = d;
  });
  if(mejor === Infinity){ $('#radarTxt').textContent = 'Las que faltan están bajo techo';
                          $('#radarDist').textContent = 'guíate por las pistas'; return; }
  const c = calor(mejor);
  $('#radarTxt').textContent = c.t; $('#radarTxt').style.color = c.c;
  $('#radarDist').textContent = 'la más cercana está a ' + Math.round(mejor) + ' m · precisión ± ' +
    Math.round(posGps.prec) + ' m';
}

/* ---------- 7. detección y captura ---------- */
let vistoActual = -1;
function alDetectar(i){
  if(vistoActual === i) return;
  vistoActual = i;
  const f = CAZA.figuras[i], p = prog.figs[i], def = CUERPOS[f.cuerpo];
  construirFigura(f);
  if(contenido.parent !== raices[i]) raices[i].add(contenido);

  if(p.capturada){
    $('#msjCam').innerHTML = `Ya tenías esta figura<small>${esc(def.nombre)} · ${esc(textoMedidas(f))}</small>`;
    $('#accionCam').innerHTML = '<button class="btn ancho">Ver el reto</button>';
    $('#accionCam').firstChild.onclick = () => abrirReto(i, false);
  }else{
    $('#msjCam').innerHTML = `¡Encontraste una figura!<small>Aparece sobre el marcador</small>`;
    $('#accionCam').innerHTML = '<button class="btn pri ancho">¡Capturar!</button>';
    $('#accionCam').firstChild.onclick = () => {
      p.capturada = true; prog.puntos += PUNTOS_CAPTURA; guardarProg();
      abrirReto(i, true);
    };
  }
}
function alPerder(){
  if(vistoActual < 0) return;
  vistoActual = -1;
  $('#msjCam').innerHTML = 'Busca el marcador escondido<small>Enfócalo completo, a unos 30–50 cm</small>';
  $('#accionCam').innerHTML = '';
}

/* ---------- 8. pantalla de reto ---------- */
let retoActual = -1;
function abrirReto(i, reciencapturada){
  retoActual = i;
  modo = 'reto';
  const f = CAZA.figuras[i], p = prog.figs[i], def = CUERPOS[f.cuerpo], dims = dimsFigura(f);
  const r = def.calc(dims);

  $('#capaCam').style.display = 'none';
  $('#salirCam').style.display = 'none';
  pararCamara();
  $('#pIni').classList.add('oculta');
  $('#pReto').classList.remove('oculta');

  tArmado = 1; $('#rDes').value = 0; $('#rDesTxt').textContent = 'armado';
  construirFigura(f);
  raizPC.add(contenido); raizPC.visible = true;

  $('#rTitulo').textContent = reciencapturada ? '¡Figura capturada!' : 'Figura de tu álbum';
  $('#rNombre').textContent = def.nombre;
  $('#rMedidas').textContent = textoMedidas(f);
  $('#rCaptura').style.display = reciencapturada ? 'block' : 'none';
  $('#rCaptura').innerHTML = '+' + PUNTOS_CAPTURA + ' puntos por encontrarla. Ahora resuélvela para sumar el resto.';

  const inV = $('#rVol'), inA = $('#rAre');
  inV.value = p.vol ? redondea(r.vo.v) : ''; inA.value = p.are ? redondea(r.at.v) : '';
  inV.disabled = p.vol; inA.disabled = p.are;
  inV.className = p.vol ? 'ok' : ''; inA.className = p.are ? 'ok' : '';
  $('#pVol').innerHTML = p.vol ? '✔ correcto' : pistaFormula(r.vo.f);
  $('#pAre').innerHTML = p.are ? '✔ correcto' : pistaFormula(r.at.f);
  $('#rAviso').innerHTML = '';
  $('#btnComprobar').style.display = (p.vol && p.are) ? 'none' : 'block';
  $('#rPuntos').textContent = prog.puntos;

  ajustarVista3D();
}
function redondea(v){ return Math.round(v*100)/100; }
/* solo la fórmula, sin los valores sustituidos: la sustitución es tarea del alumno */
function pistaFormula(f){ return 'Fórmula: ' + String(f).split('=')[0] + '= …'; }

$('#rDes').addEventListener('input', e => {
  tArmado = 1 - e.target.value/100; aplicarPliegue();
  $('#rDesTxt').textContent = e.target.value == 0 ? 'armado' : (e.target.value == 100 ? 'red plana' : e.target.value + '%');
});

$('#btnComprobar').onclick = () => {
  const i = retoActual, f = CAZA.figuras[i], p = prog.figs[i];
  const r = CUERPOS[f.cuerpo].calc(dimsFigura(f));
  const inV = $('#rVol'), inA = $('#rAre');
  let msj = [];

  if(!p.vol){
    const v = parseFloat(inV.value.replace(',','.'));
    if(inV.value === ''){ msj.push('Escribe el volumen.'); }
    else if(esCorrecta(v, r.vo.v)){
      p.vol = true; const g = PUNTOS[Math.min(p.intV, 3)]; prog.puntos += g;
      inV.className = 'ok'; inV.disabled = true; $('#pVol').innerHTML = '✔ correcto  +' + g + ' pts';
      msj.push('Volumen correcto.');
    }else{
      p.intV++; inV.className = 'mal';
      if(p.intV >= 3){ $('#pVol').innerHTML = 'Respuesta: ' + redondea(r.vo.v).toLocaleString('es-NI') +
          ' cm³ · ' + r.vo.f; }
      else $('#pVol').innerHTML = pistaFormula(r.vo.f) + '  ·  intento ' + p.intV + ' de 3';
      msj.push('El volumen no es correcto.');
    }
  }
  if(!p.are){
    const a = parseFloat(inA.value.replace(',','.'));
    if(inA.value === ''){ msj.push('Escribe el área total.'); }
    else if(esCorrecta(a, r.at.v)){
      p.are = true; const g = PUNTOS[Math.min(p.intA, 3)]; prog.puntos += g;
      inA.className = 'ok'; inA.disabled = true; $('#pAre').innerHTML = '✔ correcto  +' + g + ' pts';
      msj.push('Área correcta.');
    }else{
      p.intA++; inA.className = 'mal';
      if(p.intA >= 3){ $('#pAre').innerHTML = 'Respuesta: ' + redondea(r.at.v).toLocaleString('es-NI') +
          ' cm² · ' + r.at.f; }
      else $('#pAre').innerHTML = pistaFormula(r.at.f) + '  ·  intento ' + p.intA + ' de 3';
      msj.push('El área no es correcta.');
    }
  }
  guardarProg();
  $('#rPuntos').textContent = prog.puntos;
  const listo = p.vol && p.are;
  $('#rAviso').innerHTML = listo
    ? '<div class="exito"><b>¡Figura resuelta!</b> Vuelve al mapa y busca la siguiente.</div>'
    : '<div class="aviso">' + msj.join(' ') + '</div>';
  if(listo){ $('#btnComprobar').style.display = 'none'; }
};

/* ---------- 9. bucle de render ---------- */
function ajustarVista3D(){
  const c = $('#vista3d').getBoundingClientRect();
  camPC.aspect = c.width / Math.max(1, c.height); camPC.updateProjectionMatrix();
  camPC.position.set(0, 1.35, 3.4); camPC.lookAt(0, .5, 0);
}
addEventListener('resize', () => {
  if(modo === 'reto'){ ajustarVista3D(); } else { renderer.setSize(innerWidth, innerHeight); }
  ajustarAR();
});

function bucle(){
  requestAnimationFrame(bucle);
  if(modo === 'camara'){
    renderer.domElement.style.cssText = 'position:fixed;inset:0;z-index:2;display:block';
    if(arSource && arSource.ready && arContext) arContext.update(arSource.domElement);
    let vis = -1;
    for(let i=0;i<raices.length;i++) if(raices[i].visible){ vis = i; break; }
    if(vis >= 0) alDetectar(vis); else alPerder();
    renderer.render(escena, camAR);
  }else if(modo === 'reto'){
    const c = $('#vista3d').getBoundingClientRect();
    if(c.width > 0 && c.bottom > 0 && c.top < innerHeight){
      renderer.setSize(c.width, c.height, false);
      renderer.domElement.style.cssText =
        `position:fixed;left:${c.left}px;top:${c.top}px;width:${c.width}px;height:${c.height}px;` +
        `z-index:7;display:block;border-radius:14px`;
      raizPC.rotation.y += 0.006;
      renderer.render(escena, camPC);
    }else{
      renderer.domElement.style.display = 'none';   // el visor salió de la pantalla al desplazar
    }
  }
}

irInicio();
bucle();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

window.__caza = {
  caza: CAZA, prog: () => prog,
  capturar: (i) => { prog.figs[i].capturada = true; prog.puntos += PUNTOS_CAPTURA; guardarProg(); abrirReto(i,true); },
  responder: (v,a) => { $('#rVol').value = v; $('#rAre').value = a; $('#btnComprobar').click(); },
  inicio: irInicio, gps: (lat,lon,prec) => { posGps = {lat,lon,prec:prec||5}; pintarInicio(); }
};
</script>
